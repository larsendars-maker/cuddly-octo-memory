name: security
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --check server.js
      - run: node --check src/auth.js
      - run: node --check src/crypto.js
      - run: npm audit --audit-level=high

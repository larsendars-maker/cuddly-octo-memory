services:
  - type: web
    name: orbitdesk
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbitdesk-db
          property: connectionString
      - key: PHOTO_ENCRYPTION_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

databases:
  - name: orbitdesk-db
    plan: free

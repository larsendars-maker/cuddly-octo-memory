services:
  - type: web
    name: orbitdesk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PHOTO_ENCRYPTION_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

# Optional persistence: add a Render PostgreSQL database and set DATABASE_URL
# in the existing Web Service to the database Internal URL.
# This project can start without it using temporary in-memory storage.

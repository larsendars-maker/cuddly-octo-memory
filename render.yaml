services:
  - type: web
    name: orbitdesk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: Larsenda
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: orbitdesk-db
          property: connectionString
      - key: PHOTO_ENCRYPTION_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: MAIL_PROVIDER
        value: apps-script
      - key: MAIL_BRIDGE_URL
        sync: false
      - key: MAIL_BRIDGE_TOKEN
        sync: false
      - key: MAIL_FROM_NAME
        value: OrbitDesk
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

databases:
  - name: orbitdesk-db
    plan: free
    region: virginia

# Maximum registrations from one IP address

MAX_ACCOUNTS_PER_IP=2
